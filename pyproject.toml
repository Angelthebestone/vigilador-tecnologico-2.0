[project]
name = "vigilancia-multiagente"
version = "0.1.0"
description = "Sistema multiagente de vigilancia tecnologica"
readme = "SPEC_V2.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "sqlalchemy>=2.0.30",
  "asyncpg>=0.29.0",
  "pgvector>=0.3.2",
  "networkx>=3.3",
  "scipy>=1.13.0",
  "spacy>=3.7.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "scikit-learn>=1.4.0",
  "matplotlib>=3.8.0",
  "SciencePlots>=2.1.0",
  "aiofiles>=23.2.0",
  "mcp>=1.0.0",
  "httpx>=0.27.0",
  "sse-starlette>=2.1.2",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Script de exploración manual: intercala print() con import a propósito
# para separar cada función bajo prueba en la salida de consola.
"tests/debug_functions.py" = ["E402"]

