[project]
name = "vigilancia-multiagente"
version = "0.1.0"
description = "Sistema multiagente de vigilancia tecnologica"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "sqlalchemy>=2.0.30",
  "asyncpg>=0.29.0",
  "pgvector>=0.3.2",
  "networkx>=3.3",
  "scipy>=1.13.0",
  "spacy>=3.7.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "scikit-learn>=1.4.0",
  "vaderSentiment>=3.3.2",
  "matplotlib>=3.8.0",
  "SciencePlots>=2.1.0",
  "aiofiles>=23.2.0",
  "mcp>=1.0.0",
  "httpx>=0.27.0",
  "sse-starlette>=2.1.2",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.2",
  "rank_bm25>=0.2.2",
  # Spec 009 — Vigilador 3.0 MVP foundation (enterprise/)
  "openai>=1.40",
  "cryptography>=42",
  "apscheduler>=3.10",
  "prometheus-client>=0.19",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  # Spec 016/018 — MVP ola 1 (audit CLI + document tools)
  "click>=8.1",
  "jinja2>=3.1",
  "python-docx>=1.1",
]

[project.scripts]
vigilador-admin = "vigilancia_multiagente.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "basedpyright>=1.39.0",
  # Spec 009 — mock del endpoint OpenAI-compatible en tests del XiaomimimoClient
  "respx>=0.21",
]
pdf = ["weasyprint>=61.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Ruleset ampliado: además del set por defecto (E, F) se activan familias
# de alto valor — bugs probables (B), simplificación (SIM), modernización
# (UP), reglas ruff (RUF), perf (PERF, C4, PIE), orden de imports (I),
# returns (RET).
#
# Quedaron fuera por ser ruidosas o contextuales en este codebase:
#   ARG  → handlers FastAPI / callbacks con firma fija (no es código muerto)
#   N    → NetworkX usa G, B como convención (no son malos nombres)
#   TC   → mover imports a TYPE_CHECKING aporta poco aquí
select = [
    "E",
    "F",
    "B",
    "SIM",
    "UP",
    "RUF",
    "PIE",
    "C4",
    "PERF",
    "I",
    "RET",
]
ignore = [
    # El formateador ya gestiona el ancho razonable; forzarlo en
    # strings/URLs largas genera ruido sin valor.
    "E501",
    # PERF401/403: reescribir loops con lógica condicional como
    # comprehensions en código crítico (graph service) añade riesgo
    # de regresión por una ganancia de microsegundos. No vale la pena.
    "PERF401",
    "PERF403",
]

[tool.ruff.lint.flake8-bugbear]
# Depends/Query/Path/Body en defaults es el patrón idiomático de FastAPI,
# no un bug (B008).
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
]

[tool.ruff.lint.per-file-ignores]
# Script de exploración manual: intercala print() con import a propósito
# para separar cada función bajo prueba en la salida de consola.
"tests/debug_functions.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
# Adopción gradual: chequeo pragmático en código de dominio/lógica.
# No se exigen anotaciones completas (no disallow_untyped_defs) para no
# bloquear el desarrollo; el foco es detectar errores de tipo reales.
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
exclude = ["tests/debug_functions.py"]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"
include = ["src/vigilancia_multiagente"]
exclude = ["tests", "scripts", "mock_server.py", "specs", "docs"]
reportMissingTypeStubs = false
reportMissingImports = false

# executionEnvironments permite rutas específicas por módulo
# (el equivalente funcional a mypy [[tool.mypy.overrides]])
[[tool.basedpyright.executionEnvironments]]
root = "src/vigilancia_multiagente"
extraPaths = ["src"]

[[tool.mypy.overrides]]
# Capa de infraestructura: SQLAlchemy/asyncpg devuelven RowMapping y
# columnas tipadas como `object`. mypy las marca como incompatibles aunque
# en runtime son correctas — es ruido de librería sin stubs precisos, no
# bugs. Se relaja el chequeo nominal aquí.
module = [
    "vigilancia_multiagente.infra.persistence.*",
    "vigilancia_multiagente.infra.mcp.provider_registry",
]
disable_error_code = ["arg-type", "attr-defined", "call-overload", "assignment"]

