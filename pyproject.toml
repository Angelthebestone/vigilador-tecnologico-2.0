[project]
name = "vigilancia-multiagente"
version = "0.1.0"
description = "Sistema multiagente de vigilancia tecnologica"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "sqlalchemy>=2.0.30",
  "asyncpg>=0.29.0",
  "pgvector>=0.3.2",
  "networkx>=3.3",
  "scipy>=1.13.0",
  "spacy>=3.7.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "scikit-learn>=1.4.0",
  "vaderSentiment>=3.3.2",
  "matplotlib>=3.8.0",
  "SciencePlots>=2.1.0",
  "aiofiles>=23.2.0",
  "mcp>=1.0.0",
  "httpx>=0.27.0",
  "sse-starlette>=2.1.2",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.2",
  "rank_bm25>=0.2.2",
  # Spec 009 — Vigilador 3.0 MVP foundation (enterprise/)
  "openai>=1.40",
  "cryptography>=42",
  "apscheduler>=3.10",
  "prometheus-client>=0.19",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  # Spec 016/018 — MVP ola 1 (audit CLI + document tools)
  "click>=8.1",
  "jinja2>=3.1",
  "python-docx>=1.1",
  # Spec 021 D1-revisada — TurboVec native vector index
  "turbovec>=0.6.0",
  # Spec 022 Ola 4 — SDK migrations for research providers
  "tavily-python>=0.5.0,<1.0.0",
  "exa-py>=1.5.0,<2.0.0",
  "firecrawl-py>=2.0.0,<3.0.0",
  "pyalex>=0.18.0,<1.0.0",
  "arxiv>=2.1.0,<3.0.0",
]

[project.scripts]
vigilador-admin = "vigilancia_multiagente.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "basedpyright>=1.39.0",
  # Spec 009 — mock del endpoint OpenAI-compatible en tests del XiaomimimoClient
  "respx>=0.21",
]
pdf = ["weasyprint>=61.0"]
# Spec 021 — optional native tools (each declared as opt-in for size control)
markitdown = ["markitdown>=0.0.1"]
scholar = ["scholarly>=1.7"]
sandbox = ["e2b>=0.16"]
browser = ["playwright>=1.40"]
# Spec 021 F3a — Computer use Win11 backend (pyautogui + pygetwindow + mss)
desktop = ["pyautogui>=0.9.54", "pygetwindow>=0.0.9", "mss>=9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "**/_cold/**",
    "**/_roadmap/**",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "B",
    "SIM",
    "UP",
    "RUF",
    "PIE",
    "C4",
    "PERF",
    "I",
    "RET",
]
ignore = [
    "E501",
    "PERF401",
    "PERF403",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
]

[tool.ruff.lint.per-file-ignores]
"tests/debug_functions.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
exclude = ["tests/debug_functions.py"]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"
include = ["src/vigilancia_multiagente"]
  exclude = ["tests", "scripts", "mock_server.py", "specs", "docs", "**/_cold/**", "**/_roadmap/**"]
reportMissingTypeStubs = false
reportMissingImports = false
reportMissingModuleSource = false

[[tool.basedpyright.executionEnvironments]]
root = "src/vigilancia_multiagente"
extraPaths = ["src"]

[[tool.mypy.overrides]]
module = [
    "vigilancia_multiagente.infra.persistence.*",
    "vigilancia_multiagente.infra.mcp.provider_registry",
]
disable_error_code = ["arg-type", "attr-defined", "call-overload", "assignment"]
